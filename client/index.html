<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta name="color-scheme" content="light only" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#174b36" />
    <meta name="description" content="ORIGINAL – أورجنال، احتياجات يومك على اختيارك." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="أورجنال" />
    <link rel="manifest" href="/manifest.webmanifest?v=85" />
    <link rel="icon" type="image/png" sizes="192x192" href="/app-icon-192-v85.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/app-icon-192-v85.png" />
    <title>ORIGINAL – أورجنال</title>
  </head>
  <body style="background:#f8f9fa;margin:0;font-family:system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent">
    <div id="root">
      <div style="background:linear-gradient(180deg,#174b36 0%,#0f3525 100%);color:#fff;padding:12px 16px 14px;box-shadow:0 4px 20px rgba(15,53,37,0.15)">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:600px;margin:0 auto">
          <div style="display:flex;align-items:center;gap:10px">
            <img src="/app-icon-192-v85.png" alt="ORIGINAL" style="width:40px;height:40px;border-radius:12px;border:1.5px solid #d4af37;box-shadow:0 3px 10px rgba(0,0,0,0.2);display:block" />
            <div><strong style="font-size:15px;letter-spacing:0.5px;color:#fff;display:block;line-height:1.2">ORIGINAL</strong><small style="font-size:11px;color:#d8b454;font-weight:700">أورجنال · سوبرماركت</small></div>
          </div>
          <div style="display:flex;align-items:center;gap:8px">
            <div style="width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,0.12);display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px">🛒</div>
          </div>
        </div>
        <div style="margin-top:12px;max-width:600px;margin-left:auto;margin-right:auto">
          <div style="background:#fff;border-radius:14px;padding:10px 14px;display:flex;align-items:center;gap:9px;color:#8a9a90;font-size:13px;box-shadow:0 3px 10px rgba(0,0,0,0.06)"><span>🔍</span><span>ابحث عن احتياجاتك اليومية...</span></div>
        </div>
      </div>
      <div style="max-width:600px;margin:16px auto;padding:0 14px">
        <div style="height:105px;border-radius:18px;background:linear-gradient(135deg,#13462f 0%,#0b2b1d 100%);border:1.5px solid #d4af37;display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 6px 18px rgba(17,58,40,0.12)">
          <div style="text-align:center">
            <div style="font-size:14px;font-weight:800;color:#f3d17c;margin-bottom:4px">🌿 مرحباً بك في أورجنال</div>
            <div style="font-size:11px;color:#e0ece4">توصيل مقاضيك لباب بيتك في صنعاء</div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  
    

  
    <script>
      (function() {
        function syncVariantModalPrice() {
          try {
            var buttons = Array.from(document.querySelectorAll("button"));
            var addBtn = buttons.find(function(b) {
              return b.textContent && b.textContent.indexOf("إضافة إلى السلة") !== -1;
            });
            if (!addBtn) return;

            var modal = addBtn.parentElement;
            while (modal && modal !== document.body && modal.querySelectorAll("button").length < 4) {
              modal = modal.parentElement;
            }
            if (!modal) return;

            var modalButtons = Array.from(modal.querySelectorAll("button"));
            var selectedOptBtn = modalButtons.find(function(b) {
              if (b === addBtn) return false;
              var txt = (b.textContent || "").trim();
              if (txt.indexOf(":") === -1) return false;
              var style = window.getComputedStyle(b);
              var rgb = (style.backgroundColor || "").match(/\d+/g);
              var isDarkGreen = rgb && rgb.length >= 3 && Number(rgb[0]) < 100 && Number(rgb[1]) < 150 && Number(rgb[2]) < 120;
              var cls = b.className || "";
              return isDarkGreen || cls.indexOf("selected") !== -1 || cls.indexOf("active") !== -1;
            });
            if (!selectedOptBtn) return;

            var rawTxt = (selectedOptBtn.textContent || "").trim();
            var m = rawTxt.match(/:\s*(\d+(?:\.\d+)?)/);
            if (!m || !m[1]) return;
            var unitPrice = parseFloat(m[1]);
            if (isNaN(unitPrice) || unitPrice <= 0) return;

            var qty = 1;
            var allEls = Array.from(modal.querySelectorAll("span, div, strong, b"));
            for (var i = 0; i < allEls.length; i++) {
              var st = (allEls[i].textContent || "").trim();
              if (/^\d+$/.test(st) && allEls[i].children.length === 0) {
                var val = parseInt(st, 10);
                if (val >= 1 && val <= 999) {
                  qty = val;
                  break;
                }
              }
            }
            var totalPrice = Math.round(unitPrice * qty);

            allEls.forEach(function(el) {
              if (el === addBtn || addBtn.contains(el)) return;
              var fullTxt = (el.textContent || "").trim();
              if (fullTxt.indexOf("ر.ي") !== -1 && fullTxt.indexOf("/") !== -1 && el.children.length <= 2) {
                var expectedSub = fullTxt.replace(/^\s*\d[\d,.]*/, unitPrice.toLocaleString("en-US"));
                if (fullTxt !== expectedSub) {
                  var tw = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null);
                  var tn;
                  var replacedNode = false;
                  while ((tn = tw.nextNode())) {
                    if (tn.nodeValue && /\d/.test(tn.nodeValue)) {
                      tn.nodeValue = tn.nodeValue.replace(/\d[\d,.]*/, unitPrice.toLocaleString("en-US"));
                      replacedNode = true;
                      break;
                    }
                  }
                  if (!replacedNode) el.textContent = expectedSub;
                }
              }
            });

            var btnFullTxt = (addBtn.textContent || "").trim();
            var targetPriceStr = totalPrice.toLocaleString("en-US");
            if (btnFullTxt.indexOf("(" + targetPriceStr + " ر.ي)") === -1) {
              var twBtn = document.createTreeWalker(addBtn, NodeFilter.SHOW_TEXT, null);
              var textNodes = [];
              var n;
              while ((n = twBtn.nextNode())) {
                textNodes.push(n);
              }
              if (textNodes.length > 1) {
                for (var j = 0; j < textNodes.length; j++) {
                  if (/^\s*\d[\d,.]*\s*$/.test(textNodes[j].nodeValue || "")) {
                    textNodes[j].nodeValue = targetPriceStr;
                  } else if ((textNodes[j].nodeValue || "").indexOf("ر.ي") !== -1 && /\d/.test(textNodes[j].nodeValue || "")) {
                    textNodes[j].nodeValue = (textNodes[j].nodeValue || "").replace(/\d[\d,.]*/, targetPriceStr);
                  }
                }
              } else if (textNodes.length === 1) {
                textNodes[0].nodeValue = " إضافة إلى السلة (" + targetPriceStr + " ر.ي) ";
              }
            }
          } catch (e) {}
        }
        document.addEventListener("click", function() {
          setTimeout(syncVariantModalPrice, 5);
          setTimeout(syncVariantModalPrice, 40);
          setTimeout(syncVariantModalPrice, 120);
        }, true);
        setInterval(syncVariantModalPrice, 150);
      })();
    </script>

  </body>
</html>
