    <script>
      (function(){
        var canvas = document.getElementById("orig-particles");
        var animId = 0;
        if (canvas && canvas.getContext) {
          var ctx = canvas.getContext("2d");
          var w = canvas.width = window.innerWidth || 380;
          var h = canvas.height = window.innerHeight || 720;
          var cx = w / 2, cy = h / 2 - 36;
          var streaks = [];
          for (var i = 0; i < 32; i++) {
            streaks.push({
              x: Math.random() * w,
              y: -Math.random() * h * 0.8,
              vy: 5 + Math.random() * 7,
              len: 22 + Math.random() * 35,
              gold: i % 3 !== 0,
              alpha: 0.35 + Math.random() * 0.55,
            });
          }
          var start = performance.now();
          function draw(now) {
            var t = (now - start) / 1000;
            ctx.clearRect(0, 0, w, h);
            for (var i = 0; i < streaks.length; i++) {
              var s = streaks[i];
              if (t < 1.1) {
                s.y += s.vy;
                s.x += (cx - s.x) * 0.035;
              } else {
                s.x += (cx - s.x) * 0.12;
                s.y += (cy - s.y) * 0.12;
                s.alpha *= 0.92;
              }
              ctx.save();
              ctx.strokeStyle = s.gold ? "rgba(247, 217, 124," + s.alpha + ")" : "rgba(110, 231, 183," + s.alpha + ")";
              ctx.lineWidth = s.gold ? 2.4 : 2;
              ctx.lineCap = "round";
              ctx.beginPath();
              ctx.moveTo(s.x, s.y);
              ctx.lineTo(s.x, s.y - s.len);
              ctx.stroke();
              ctx.restore();
            }
            if (t < 2.5) animId = requestAnimationFrame(draw);
          }
          animId = requestAnimationFrame(draw);
        }
        var dismissed = false;
        function hideSplash() {
          if (dismissed) return;
          var el = document.getElementById("orig-splash");
          if (!el) return;
          dismissed = true;
          if (animId) cancelAnimationFrame(animId);
          el.classList.add("hide");
          setTimeout(function(){ if (el && el.parentNode) el.parentNode.removeChild(el); }, 450);
        }
        window.__hideOriginalSplash = hideSplash;
        requestAnimationFrame(function(){ setTimeout(hideSplash, 2500); });
      })();
    </script>
